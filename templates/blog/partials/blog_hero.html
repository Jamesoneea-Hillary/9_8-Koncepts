<section class="blog-hero">

    <div class="blog-hero-grid"></div>

    <div class="blog-hero-glow blog-hero-glow--one"></div>
    <div class="blog-hero-glow blog-hero-glow--two"></div>

    <div class="blog-hero-content">

        <div class="blog-eyebrow">

            <span></span>

            <span>
                INSIGHTS • TECHNOLOGY • INNOVATION
            </span>

        </div>


        <h1>

            Ideas that build <span>the future.</span>

        </h1>


        <p>

            Explore insights, technology trends, software
            engineering knowledge, and ideas shaping the
            digital world.

        </p>


        <div class="blog-hero-meta">

            <div class="meta-item">

                <span class="meta-number">
                    {{ posts.paginator.count|default:"0" }}
                </span>

                <span>
                    Articles
                </span>

            </div>


            <div class="meta-divider"></div>


            <div class="meta-item">

                <span class="meta-number">
                    {{ categories.count|default:"0" }}
                </span>

                <span>
                    Topics
                </span>

            </div>

        </div>

    </div>

    <div class="blog-hero-rule"></div>

</section>
