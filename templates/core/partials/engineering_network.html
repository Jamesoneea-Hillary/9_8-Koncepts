{%load static %}
<div class="engineering-network">

    <!-- SVG CONNECTIONS -->

    <svg class="network-lines">

        <line x1="250" y1="250" x2="120" y2="90"/>
        <line x1="250" y1="250" x2="380" y2="110"/>
        <line x1="250" y1="250" x2="90" y2="250"/>
        <line x1="250" y1="250" x2="410" y2="250"/>
        <line x1="250" y1="250" x2="130" y2="410"/>
        <line x1="250" y1="250" x2="380" y2="390"/>

    </svg>

    <!-- CENTER -->

    <div class="core-node">

        <img src="{% static 'images/logo/logo.jpg' %}" alt="Nine Eight Koncepts">

    </div>

    <!-- TECHNOLOGIES -->

    <div class="tech-node python">

        <i class="bi bi-code-slash"></i>

        <span>Python</span>

    </div>

    <div class="tech-node django">

        <i class="bi bi-window-stack"></i>

        <span>Django</span>

    </div>

    <div class="tech-node flutter">

        <i class="bi bi-phone"></i>

        <span>Flutter</span>

    </div>

    <div class="tech-node react">

        <i class="bi bi-cpu"></i>

        <span>React</span>

    </div>

    <div class="tech-node docker">

        <i class="bi bi-box"></i>

        <span>Docker</span>

    </div>

    <div class="tech-node aws">

        <i class="bi bi-cloud"></i>

        <span>AWS</span>

    </div>

</div>
