<article class="job-card">

    <div class="job-card__top">

        <span class="job-card__department">
            {{ job.department }}
        </span>

        {% if job.is_featured %}
            <span class="job-card__featured">
                FEATURED
            </span>
        {% endif %}

    </div>

    <h3>
        {{ job.title }}
    </h3>

    <p class="job-card__description">
        {{ job.short_description }}
    </p>

    <div class="job-card__meta">

        <span>
            {{ job.get_employment_type_display }}
        </span>

        <span>
            {{ job.get_work_mode_display }}
        </span>

        {% if job.location %}
            <span>
                {{ job.location }}
            </span>
        {% endif %}

    </div>

    <a
        href="{{ job.get_absolute_url }}"
        class="job-card__link"
    >
        VIEW POSITION
        <span>↗</span>
    </a>

</article>
